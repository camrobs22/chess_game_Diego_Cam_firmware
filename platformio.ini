[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    fastled/FastLED
    bblanchon/ArduinoJson
    links2004/WebSockets

monitor_speed = 115200
upload_speed = 115200

monitor_port = /dev/tty.usbserial-0001
upload_port = /dev/tty.usbserial-0001